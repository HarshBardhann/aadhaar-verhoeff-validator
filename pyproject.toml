[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aadhaar-verhoeff-validator"
version = "0.1.0"
description = "Local format and Verhoeff checksum validation for Aadhaar-formatted strings"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Project contributors"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
